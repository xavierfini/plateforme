<style>
.journal-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
@media(max-width:900px){ .journal-layout { grid-template-columns: 1fr; } }

/* EDITOR */
.entry-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.entry-date { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: .88rem; color: var(--text); outline: none; font-family: 'Syne', sans-serif; }
.mood-row { display: flex; align-items: center; gap: 8px; }
.mood-lbl { font-family: 'Syne', sans-serif; font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.mood-selector { display: flex; gap: 6px; }
.mood-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); font-size: 1.15rem; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
.mood-btn:hover, .mood-btn.selected { border-color: var(--cyan); background: var(--surface2); transform: scale(1.1); }
.tags-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.tag-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); font-size: .72rem; padding: 4px 10px; border-radius: 99px; cursor: pointer; transition: all .2s; font-family: 'Syne', sans-serif; font-weight: 600; }
.tag-chip.selected { background: rgba(0,229,255,.15); border-color: var(--cyan); color: var(--cyan); }
.custom-tag-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; color: var(--text); font-size: .72rem; outline: none; width: 110px; font-family: 'Syne', sans-serif; }
.custom-tag-input:focus { border-color: var(--cyan); }
.writing-editor { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; color: var(--text); font-size: 1rem; line-height: 1.85; outline: none; resize: none; min-height: 300px; width: 100%; caret-color: var(--cyan); font-family: Georgia, serif; transition: border-color .2s; }
.writing-editor:focus { border-color: var(--cyan); }
.writing-editor::placeholder { color: var(--text-muted); font-style: italic; }
.editor-footer { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.word-count { font-family: 'Syne', sans-serif; font-size: .72rem; color: var(--text-muted); flex: 1; }

/* SIDEBAR */
.side-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.side-panel-title { font-family: 'Syne', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
.streak-display { text-align: center; padding: 6px 0 14px; }
.streak-num { font-family: 'Clash Display', sans-serif; font-size: 2.8rem; font-weight: 700; color: var(--orange); }
.streak-lbl { font-family: 'Syne', sans-serif; font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.mood-chart { display: flex; align-items: flex-end; gap: 4px; height: 72px; margin-top: 4px; }
.mood-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
.mood-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 4px; transition: height .3s; }
.mood-bar-emoji { font-size: .75rem; }
.mood-bar-day { font-family: 'Syne', sans-serif; font-size: .6rem; color: var(--text-muted); }
.stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-family: 'Syne', sans-serif; font-size: .8rem; }
.stat-row:last-child { border-bottom: none; }
.stat-row .val { font-weight: 700; color: var(--cyan); }
.entries-list { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; }
.entry-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; transition: border-color .2s; }
.entry-item:hover { border-color: var(--cyan); }
.entry-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.entry-item-date { font-family: 'Syne', sans-serif; font-size: .72rem; color: var(--text-muted); }
.entry-item-preview { font-size: .78rem; color: var(--text-muted); line-height: 1.4; }
.entry-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.entry-tag { font-size: .65rem; background: var(--border); padding: 2px 6px; border-radius: 99px; color: var(--text-muted); font-family: 'Syne', sans-serif; }
</style>
</head>
<body>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Journal & Humeur</h1>
      <p class="page-subtitle">Écris, ressens, trace ton chemin</p>
    </div>
    <button class="btn btn-ghost" onclick="newEntry()">+ Nouvelle entrée</button>
  </div>

  <div class="journal-layout">
    <!-- ÉDITEUR -->
    <div>
      <div class="entry-meta">
        <input type="date" id="entry-date" class="entry-date">
        <div class="mood-row">
          <span class="mood-lbl">Humeur :</span>
          <div class="mood-selector">
            <button class="mood-btn" data-mood="5" title="Excellent" onclick="selectMood(5)">😄</button>
            <button class="mood-btn" data-mood="4" title="Bien" onclick="selectMood(4)">🙂</button>
            <button class="mood-btn" data-mood="3" title="Neutre" onclick="selectMood(3)">😐</button>
            <button class="mood-btn" data-mood="2" title="Bof" onclick="selectMood(2)">😕</button>
            <button class="mood-btn" data-mood="1" title="Difficile" onclick="selectMood(1)">😞</button>
          </div>
        </div>
      </div>
      <div class="tags-row" id="tags-row"></div>
      <textarea class="writing-editor" id="entry-text" placeholder="Comment s'est passée ta journée ? Qu'est-ce que tu ressens en ce moment ?…" oninput="updateCount()"></textarea>
      <div class="editor-footer">
        <span class="word-count" id="char-count">0 mot</span>
        <button class="btn btn-danger" id="btn-delete-entry" style="display:none" onclick="deleteEntry()">Supprimer</button>
        <button class="btn btn-primary" onclick="saveEntry()">Sauvegarder ✓</button>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div>
      <div class="side-panel">
        <div class="side-panel-title">🔥 Régularité</div>
        <div class="streak-display">
          <div class="streak-num" id="streak-num">0</div>
          <div class="streak-lbl">jours consécutifs</div>
        </div>
      </div>
      <div class="side-panel">
        <div class="side-panel-title">📊 7 derniers jours</div>
        <div class="mood-chart" id="mood-chart"></div>
      </div>
      <div class="side-panel">
        <div class="side-panel-title">📈 Statistiques</div>
        <div class="stat-row"><span>Entrées totales</span><span class="val" id="st-total">0</span></div>
        <div class="stat-row"><span>Humeur moyenne</span><span class="val" id="st-avg">—</span></div>
        <div class="stat-row"><span>Mots écrits</span><span class="val" id="st-words">0</span></div>
      </div>
      <div class="side-panel">
        <div class="side-panel-title">📅 Historique</div>
        <div class="entries-list" id="entries-list"></div>
      </div>
    </div>
  </div>
</main>

<script>
const MOODS = {5:'😄',4:'🙂',3:'😐',2:'😕',1:'😞'};
const MOOD_COLORS = {5:'#3dffa0',4:'#00e5ff',3:'#ffe033',2:'#ff7a3d',1:'#ff3d82'};
const DEFAULT_TAGS = ['Études','Sport','Amis','Asso','Famille','Fatigue','Stress','Joie','Motivation'];
let entries = JSON.parse(localStorage.getItem('sh_journal') || '[]');
let editId=null, selectedMood=3, selectedTags=[];
function save() { localStorage.setItem('sh_journal', JSON.stringify(entries)); }
function todayStr() { return new Date().toISOString().substring(0,10); }
function selectMood(m) { selectedMood=m; document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('selected',+b.dataset.mood===m)); }
function buildTags() {
  const allTags=[...new Set([...DEFAULT_TAGS,...entries.flatMap(e=>e.tags||[])])];
  document.getElementById('tags-row').innerHTML='<span style="font-family:Syne,sans-serif;font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600">Tags :</span>'+
    allTags.map(t=>`<div class="tag-chip ${selectedTags.includes(t)?'selected':''}" onclick="toggleTag('${t}')">${t}</div>`).join('')+
    `<input class="custom-tag-input" placeholder="+ Tag…" onkeydown="if(event.key==='Enter')addCustomTag(this)">`;
}
function toggleTag(t) { if(selectedTags.includes(t)) selectedTags=selectedTags.filter(x=>x!==t); else selectedTags.push(t); buildTags(); }
function addCustomTag(input) { const v=input.value.trim(); if(!v)return; if(!selectedTags.includes(v)) selectedTags.push(v); input.value=''; buildTags(); }
function updateCount() { const w=document.getElementById('entry-text').value.trim().split(/\s+/).filter(Boolean).length; document.getElementById('char-count').textContent=w+' mot'+(w>1?'s':''); }
function newEntry() { editId=null; selectedMood=3; selectedTags=[]; document.getElementById('entry-date').value=todayStr(); document.getElementById('entry-text').value=''; document.getElementById('btn-delete-entry').style.display='none'; selectMood(3); buildTags(); updateCount(); }
function loadEntry(id) { const e=entries.find(x=>x.id===id); if(!e)return; editId=id; selectedMood=e.mood||3; selectedTags=[...(e.tags||[])]; document.getElementById('entry-date').value=e.date||todayStr(); document.getElementById('entry-text').value=e.text||''; document.getElementById('btn-delete-entry').style.display='inline-flex'; selectMood(e.mood); buildTags(); updateCount(); }
function saveEntry() {
  const text=document.getElementById('entry-text').value.trim();
  const date=document.getElementById('entry-date').value||todayStr();
  const words=text.split(/\s+/).filter(Boolean).length;
  const entry={id:editId||Date.now().toString(),date,mood:selectedMood,tags:[...selectedTags],text,words};
  if(editId) entries=entries.map(e=>e.id===editId?entry:e);
  else { const existing=entries.find(e=>e.date===date); if(existing){if(!confirm('Une entrée existe déjà pour ce jour. Remplacer ?'))return; entries=entries.filter(e=>e.id!==existing.id);} entries.unshift(entry); }
  save(); render();
  const btn=document.querySelector('.btn-primary[onclick="saveEntry()"]');
  btn.textContent='Sauvegardé ✓'; btn.style.background='var(--green)'; btn.style.color='#000';
  setTimeout(()=>{btn.textContent='Sauvegarder ✓'; btn.style.background=''; btn.style.color='';},1800);
}
function deleteEntry() { if(!confirm('Supprimer cette entrée ?'))return; entries=entries.filter(e=>e.id!==editId); save(); render(); newEntry(); }
function calcStreak() {
  const days=[...new Set(entries.map(e=>e.date))].sort().reverse(); if(!days.length)return 0;
  let streak=0; let cur=new Date(todayStr());
  for(let d of days){ const dd=new Date(d); const diff=Math.round((cur-dd)/86400000); if(diff===0||diff===streak){streak++;cur=new Date(dd);cur.setDate(cur.getDate()-1);}else break; }
  return streak;
}
function render() {
  buildTags();
  document.getElementById('streak-num').textContent=calcStreak();
  const days7=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days7.push(d.toISOString().substring(0,10));}
  document.getElementById('mood-chart').innerHTML=days7.map(d=>{const e=entries.find(x=>x.date===d);const m=e?e.mood:0;const h=m?Math.round(m/5*100):8;const color=m?MOOD_COLORS[m]:'var(--border)';const wd=['Di','Lu','Ma','Me','Je','Ve','Sa'][new Date(d+'T12:00').getDay()];return`<div class="mood-bar-wrap"><div class="mood-bar-emoji">${m?MOODS[m]:''}</div><div class="mood-bar" style="height:${h}%;background:${color}"></div><div class="mood-bar-day">${wd}</div></div>`;}).join('');
  document.getElementById('st-total').textContent=entries.length;
  const moods=entries.map(e=>e.mood).filter(Boolean);
  const avg=moods.length?(moods.reduce((a,b)=>a+b,0)/moods.length).toFixed(1):'—';
  document.getElementById('st-avg').textContent=avg!=='—'?MOODS[Math.round(+avg)]+' '+avg:'—';
  document.getElementById('st-words').textContent=entries.reduce((s,e)=>s+(e.words||0),0).toLocaleString('fr-FR');
  const sorted=[...entries].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('entries-list').innerHTML=sorted.length?sorted.map(e=>`<div class="entry-item" onclick="loadEntry('${e.id}')"><div class="entry-item-top"><span class="entry-item-date">${new Date(e.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</span><span>${MOODS[e.mood]||'❓'}</span></div><div class="entry-item-preview">${(e.text||'').substring(0,70)}${(e.text||'').length>70?'…':''}</div>${e.tags&&e.tags.length?`<div class="entry-tags">${e.tags.map(t=>`<span class="entry-tag">${t}</span>`).join('')}</div>`:''}</div>`).join(''):'<div style="color:var(--text-muted);font-size:.8rem;text-align:center;padding:20px">Aucune entrée</div>';
}
const todayEntry=entries.find(e=>e.date===todayStr());
if(todayEntry) loadEntry(todayEntry.id); else { document.getElementById('entry-date').value=todayStr(); selectMood(3); buildTags(); }
render();
</script>
