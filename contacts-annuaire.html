<style>
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
.search-box { flex: 1; min-width: 200px; position: relative; }
.search-box input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px 9px 36px; color: var(--text); font-size: .88rem; outline: none; font-family: 'Syne', sans-serif; transition: border-color .2s; }
.search-box input:focus { border-color: var(--cyan); }
.search-box::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: .82rem; }
.filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 14px; border-radius: var(--radius-sm); font-size: .78rem; cursor: pointer; transition: all .2s; font-family: 'Syne', sans-serif; font-weight: 600; }
.tab.active { background: var(--cyan); border-color: var(--cyan); color: #000; }

.contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.contact-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: border-color .2s, transform .15s; display: flex; flex-direction: column; gap: 10px; }
.contact-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
.contact-top { display: flex; align-items: center; gap: 12px; }
.contact-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Clash Display', sans-serif; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }
.contact-name { font-weight: 600; font-size: .95rem; }
.contact-role { font-size: .75rem; color: var(--text-muted); }
.contact-asso { display: inline-block; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; font-family: 'Syne', sans-serif; text-transform: uppercase; letter-spacing: .5px; }
.contact-info { display: flex; flex-direction: column; gap: 4px; }
.info-line { font-size: .78rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.info-line a { color: var(--cyan); text-decoration: none; }
.info-line a:hover { text-decoration: underline; }
.empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-family: 'Clash Display', sans-serif; font-size: 1.3rem; margin-bottom: 20px; }
.modal-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
.field { margin-bottom: 14px; }
.field label { display: block; font-family: 'Syne', sans-serif; font-size: .72rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.field input, .field textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); font-size: .88rem; outline: none; font-family: 'Syne', sans-serif; transition: border-color .2s; }
.field input:focus, .field textarea:focus { border-color: var(--cyan); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.color-picker { display: flex; gap: 8px; }
.color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color .2s; }
.color-opt.selected { border-color: white; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
</style>
</head>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Contacts & Annuaire</h1>
      <p class="page-subtitle">Ton répertoire associatif et personnel</p>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Ajouter un contact</button>
  </div>

  <div class="toolbar">
    <div class="search-box"><input type="text" id="search" placeholder="Rechercher un contact…" oninput="render()"></div>
    <div class="filter-tabs" id="filter-tabs"><div class="tab active" data-filter="all" onclick="setFilter(this)">Tous</div></div>
  </div>

  <div class="contacts-grid" id="contacts-grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modal-title">Nouveau contact</h2>
    <div class="field-row">
      <div class="field"><label>Prénom *</label><input type="text" id="f-first" placeholder="Prénom"></div>
      <div class="field"><label>Nom</label><input type="text" id="f-last" placeholder="Nom"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Rôle</label><input type="text" id="f-role" placeholder="Président, Trésorier…"></div>
      <div class="field"><label>Association</label><input type="text" id="f-asso" placeholder="BDE, Handball…"></div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="adresse@example.com"></div>
    <div class="field-row">
      <div class="field"><label>Téléphone</label><input type="tel" id="f-phone" placeholder="06 …"></div>
      <div class="field"><label>Réseau social</label><input type="text" id="f-social" placeholder="@pseudo"></div>
    </div>
    <div class="field"><label>Note</label><textarea id="f-note" placeholder="Info utile…" style="min-height:60px"></textarea></div>
    <div class="field">
      <label>Couleur</label>
      <div class="color-picker">
        <div class="color-opt selected" style="background:#00e5ff" data-color="#00e5ff" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#ff3d82" data-color="#ff3d82" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#ffe033" data-color="#ffe033" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#3dffa0" data-color="#3dffa0" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#b56eff" data-color="#b56eff" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#ff7a3d" data-color="#ff7a3d" onclick="selectColor(this)"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btn-delete" onclick="deleteContact()" style="display:none">Supprimer</button>
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveContact()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('sh_contacts') || '[]');
let editId = null, selectedColor = '#00e5ff', currentFilter = 'all';
function save() { localStorage.setItem('sh_contacts', JSON.stringify(contacts)); }
function getInitials(c) { return ((c.first||'')[0]||'') + ((c.last||'')[0]||'') || '?'; }
function buildFilters() {
  const assos = [...new Set(contacts.map(c=>c.asso).filter(Boolean))];
  document.getElementById('filter-tabs').innerHTML =
    `<div class="tab ${currentFilter==='all'?'active':''}" data-filter="all" onclick="setFilter(this)">Tous (${contacts.length})</div>` +
    assos.map(a=>`<div class="tab ${currentFilter===a?'active':''}" data-filter="${a}" onclick="setFilter(this)">${a}</div>`).join('');
}
function setFilter(el) { currentFilter=el.dataset.filter; render(); }
function render() {
  buildFilters();
  const q = document.getElementById('search').value.toLowerCase();
  let list = contacts.filter(c => {
    const match = currentFilter==='all' || c.asso===currentFilter;
    const search = !q || [c.first,c.last,c.role,c.asso,c.email].filter(Boolean).join(' ').toLowerCase().includes(q);
    return match && search;
  });
  const el = document.getElementById('contacts-grid');
  if(!list.length) { el.innerHTML=`<div class="empty-state"><div class="emoji">👥</div><div>Aucun contact trouvé</div></div>`; return; }
  el.innerHTML = list.map(c => {
    const initials=getInitials(c), color=c.color||'#00e5ff';
    return `<div class="contact-card" onclick="editContact('${c.id}')">
      <div class="contact-top">
        <div class="contact-avatar" style="background:${color}22;color:${color}">${initials}</div>
        <div><div class="contact-name">${c.first||''} ${c.last||''}</div><div class="contact-role">${c.role||'—'}</div></div>
      </div>
      ${c.asso?`<div><span class="contact-asso" style="background:${color}22;color:${color}">${c.asso}</span></div>`:''}
      <div class="contact-info">
        ${c.email?`<div class="info-line">✉️ <a href="mailto:${c.email}" onclick="event.stopPropagation()">${c.email}</a></div>`:''}
        ${c.phone?`<div class="info-line">📞 <a href="tel:${c.phone}" onclick="event.stopPropagation()">${c.phone}</a></div>`:''}
        ${c.social?`<div class="info-line">🔗 ${c.social}</div>`:''}
        ${c.note?`<div class="info-line">📝 ${c.note.substring(0,50)}${c.note.length>50?'…':''}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function openModal() { editId=null; selectedColor='#00e5ff'; ['first','last','role','asso','email','phone','social','note'].forEach(f=>document.getElementById('f-'+f).value=''); document.getElementById('btn-delete').style.display='none'; document.getElementById('modal-title').textContent='Nouveau contact'; updateColorUI(); document.getElementById('overlay').classList.add('open'); }
function editContact(id) { const c=contacts.find(x=>x.id===id); if(!c) return; editId=id; selectedColor=c.color||'#00e5ff'; document.getElementById('f-first').value=c.first||''; document.getElementById('f-last').value=c.last||''; document.getElementById('f-role').value=c.role||''; document.getElementById('f-asso').value=c.asso||''; document.getElementById('f-email').value=c.email||''; document.getElementById('f-phone').value=c.phone||''; document.getElementById('f-social').value=c.social||''; document.getElementById('f-note').value=c.note||''; document.getElementById('btn-delete').style.display='inline-flex'; document.getElementById('modal-title').textContent='Modifier le contact'; updateColorUI(); document.getElementById('overlay').classList.add('open'); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function selectColor(el) { selectedColor=el.dataset.color; updateColorUI(); }
function updateColorUI() { document.querySelectorAll('.color-opt').forEach(e=>e.classList.toggle('selected', e.dataset.color===selectedColor)); }
function saveContact() {
  const first=document.getElementById('f-first').value.trim(); if(!first){alert('Le prénom est requis');return;}
  const c={id:editId||Date.now().toString(), first, last:document.getElementById('f-last').value.trim(), role:document.getElementById('f-role').value.trim(), asso:document.getElementById('f-asso').value.trim(), email:document.getElementById('f-email').value.trim(), phone:document.getElementById('f-phone').value.trim(), social:document.getElementById('f-social').value.trim(), note:document.getElementById('f-note').value.trim(), color:selectedColor};
  if(editId) contacts=contacts.map(x=>x.id===editId?c:x); else contacts.unshift(c);
  save(); render(); closeModal();
}
function deleteContact() { if(!confirm('Supprimer ce contact ?')) return; contacts=contacts.filter(x=>x.id!==editId); save(); render(); closeModal(); }
render();
</script>
</body>
