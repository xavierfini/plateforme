<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub — Tâches</title>
<link rel="stylesheet" href="shared.css">
<style>
.tasks-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}

/* Sidebar filters */
.filter-sidebar {}
.filter-section { margin-bottom: 24px; }
.filter-section-title {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.filter-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: 'DM Sans', sans-serif;
}
.filter-btn:hover { background: var(--surface2); color: var(--text); }
.filter-btn.active { background: rgba(0,229,255,0.1); color: var(--cyan); }
.filter-btn.active .filter-icon { color: var(--cyan); }
.filter-count {
  font-size: 11px;
  background: var(--surface2);
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.filter-btn.active .filter-count {
  background: rgba(0,229,255,0.2);
  color: var(--cyan);
}
.filter-icon { margin-right: 8px; font-size: 15px; }

.subject-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-right: 8px;
}

/* Task list */
.tasks-main {}
.tasks-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.search-input-wrap {
  flex: 1;
  position: relative;
}
.search-input-wrap svg {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  width: 16px; height: 16px;
}
.search-input-wrap input {
  padding-left: 38px;
}

/* Sort tabs */
.sort-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px;
}
.sort-tab {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'DM Sans', sans-serif;
}
.sort-tab.active { background: var(--surface2); color: var(--text); }

/* Kanban / List toggle */
.view-toggle {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px;
}
.view-btn {
  width: 32px; height: 32px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.view-btn.active { background: var(--surface2); color: var(--cyan); }
.view-btn svg { width: 16px; height: 16px; }

/* Task groups */
.task-group { margin-bottom: 24px; }
.task-group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  user-select: none;
}
.task-group-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.task-group-count {
  font-size: 11px;
  background: var(--surface2);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.group-toggle { margin-left: auto; color: var(--text-dim); font-size: 12px; }

/* Task card */
.task-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.task-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}
.task-card.priority-haute::before { background: var(--pink); }
.task-card.priority-moyenne::before { background: var(--yellow); }
.task-card.priority-basse::before { background: var(--green); }
.task-card:hover { border-color: var(--text-dim); transform: translateX(2px); }
.task-card.done-card { opacity: 0.45; }
.task-card.done-card .task-title { text-decoration: line-through; }

.task-check {
  width: 22px; height: 22px;
  border-radius: 7px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: transparent;
  cursor: pointer;
}
.task-check:hover { border-color: var(--cyan); }
.task-card.done-card .task-check {
  background: var(--green);
  border-color: var(--green);
}
.task-card.done-card .task-check::after { content: '✓'; font-size: 12px; color: #000; font-weight: 800; }

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 500; line-height: 1.4; }
.task-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.task-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 2px 8px;
  border-radius: 20px;
}
.task-due {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.task-due.overdue { color: var(--pink); }
.task-due.soon { color: var(--yellow); }

.priority-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.p-haute { color: var(--pink); }
.p-moyenne { color: var(--yellow); }
.p-basse { color: var(--green); }

.task-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
  margin-top: 2px;
}
.task-card:hover .task-actions { opacity: 1; }
.task-action-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all 0.15s;
}
.task-action-btn:hover { background: var(--border); color: var(--text); }
.task-action-btn.del:hover { background: rgba(255,61,130,0.15); color: var(--pink); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state-text { font-size: 15px; }
.empty-state-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

/* Progress summary */
.progress-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.prog-stat { text-align: center; }
.prog-stat-val {
  font-family: 'Clash Display', sans-serif;
  font-size: 28px;
  font-weight: 700;
}
.prog-stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.prog-bar-wrap {
  flex: 1;
}
.prog-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 8px;
  color: var(--text-muted);
}
.prog-bar-outer {
  height: 10px;
  background: var(--surface2);
  border-radius: 5px;
  overflow: hidden;
}
.prog-bar-inner {
  height: 100%;
  background: var(--grad-cyan);
  border-radius: 5px;
  transition: width 0.8s ease;
}

/* Kanban view */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.kanban-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.kanban-col-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.kanban-col-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.kanban-col-count {
  margin-left: auto;
  background: var(--surface2);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  color: var(--text-muted);
}
.kanban-task {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
}
.kanban-task:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kanban-task.priority-haute { border-left-color: var(--pink); }
.kanban-task.priority-moyenne { border-left-color: var(--yellow); }
.kanban-task.priority-basse { border-left-color: var(--green); }
.kanban-task-title { font-size: 13px; font-weight: 500; }
.kanban-task-meta { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* Modal form extras */
.color-picker-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
}
.color-swatch.selected { border-color: white; transform: scale(1.15); }
</style>
</head>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Tâches</h1>
      <p class="page-subtitle" id="tasks-subtitle">Chargement…</p>
    </div>
    <button class="btn btn-primary" onclick="openAddTask()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nouvelle tâche
    </button>
  </div>

  <!-- Progress bar -->
  <div class="progress-summary fade-in">
    <div class="prog-stat">
      <div class="prog-stat-val accent-cyan" id="count-total">0</div>
      <div class="prog-stat-lbl">total</div>
    </div>
    <div class="prog-stat">
      <div class="prog-stat-val accent-green" id="count-done">0</div>
      <div class="prog-stat-lbl">terminées</div>
    </div>
    <div class="prog-stat">
      <div class="prog-stat-val accent-pink" id="count-overdue">0</div>
      <div class="prog-stat-lbl">en retard</div>
    </div>
    <div class="prog-bar-wrap">
      <div class="prog-bar-label">
        <span>Progression</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="prog-bar-outer">
        <div class="prog-bar-inner" id="prog-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="tasks-layout">
    <!-- Filter sidebar -->
    <aside class="filter-sidebar card fade-in">
      <div class="filter-section">
        <div class="filter-section-title">Affichage</div>
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">
          <span><span class="filter-icon">📋</span>Toutes les tâches</span>
          <span class="filter-count" id="fc-all">0</span>
        </button>
        <button class="filter-btn" data-filter="today" onclick="setFilter('today',this)">
          <span><span class="filter-icon">⚡</span>Aujourd'hui</span>
          <span class="filter-count" id="fc-today">0</span>
        </button>
        <button class="filter-btn" data-filter="week" onclick="setFilter('week',this)">
          <span><span class="filter-icon">📅</span>Cette semaine</span>
          <span class="filter-count" id="fc-week">0</span>
        </button>
        <button class="filter-btn" data-filter="overdue" onclick="setFilter('overdue',this)">
          <span><span class="filter-icon">🔥</span>En retard</span>
          <span class="filter-count" id="fc-overdue">0</span>
        </button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">
          <span><span class="filter-icon">✅</span>Terminées</span>
          <span class="filter-count" id="fc-done">0</span>
        </button>
      </div>

      <div class="filter-section">
        <div class="filter-section-title">Priorité</div>
        <button class="filter-btn" data-filter="p-haute" onclick="setFilter('p-haute',this)">
          <span><span class="filter-icon" style="color:var(--pink)">🔴</span>Haute</span>
          <span class="filter-count" id="fc-haute">0</span>
        </button>
        <button class="filter-btn" data-filter="p-moyenne" onclick="setFilter('p-moyenne',this)">
          <span><span class="filter-icon" style="color:var(--yellow)">🟡</span>Moyenne</span>
          <span class="filter-count" id="fc-moyenne">0</span>
        </button>
        <button class="filter-btn" data-filter="p-basse" onclick="setFilter('p-basse',this)">
          <span><span class="filter-icon" style="color:var(--green)">🟢</span>Basse</span>
          <span class="filter-count" id="fc-basse">0</span>
        </button>
      </div>

      <div class="filter-section">
        <div class="filter-section-title">Matières</div>
        <div id="subject-filters"></div>
      </div>

      <button class="btn btn-danger" style="width:100%;justify-content:center;margin-top:8px" onclick="clearDone()">
        🗑 Vider terminées
      </button>
    </aside>

    <!-- Main content -->
    <div class="tasks-main fade-in" style="animation-delay:.1s">
      <div class="tasks-toolbar">
        <div class="search-input-wrap" style="flex:1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Rechercher une tâche…" oninput="renderTasks()">
        </div>
        <div class="sort-tabs">
          <button class="sort-tab active" data-sort="created" onclick="setSort('created',this)">Récentes</button>
          <button class="sort-tab" data-sort="due" onclick="setSort('due',this)">Échéance</button>
          <button class="sort-tab" data-sort="priority" onclick="setSort('priority',this)">Priorité</button>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="list-view-btn" onclick="setView('list')" title="Vue liste">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-btn" id="kanban-view-btn" onclick="setView('kanban')" title="Vue kanban">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg>
          </button>
        </div>
      </div>

      <div id="tasks-container"></div>
    </div>
  </div>
</main>

<!-- Add/Edit Task Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-task-title">Nouvelle tâche</h2>
      <button class="modal-close" onclick="closeModal('task-modal')">✕</button>
    </div>
    <input type="hidden" id="task-id">
    <div class="form-group">
      <label>Titre *</label>
      <input type="text" id="task-title" placeholder="Que faut-il faire ?" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="task-desc" rows="2" placeholder="Détails optionnels…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priorité</label>
        <select id="task-priority">
          <option value="haute">🔴 Haute</option>
          <option value="moyenne" selected>🟡 Moyenne</option>
          <option value="basse">🟢 Basse</option>
        </select>
      </div>
      <div class="form-group">
        <label>Matière</label>
        <input type="text" id="task-subject" placeholder="ex: Maths, Physique…" list="subjects-datalist">
        <datalist id="subjects-datalist"></datalist>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Échéance</label>
        <input type="datetime-local" id="task-due">
      </div>
      <div class="form-group">
        <label>Statut</label>
        <select id="task-status">
          <option value="todo">📌 À faire</option>
          <option value="inprogress">⚙️ En cours</option>
          <option value="done">✅ Terminé</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button id="task-delete-btn" class="btn btn-danger" style="display:none" onclick="deleteTask()">🗑 Supprimer</button>
      <button class="btn btn-ghost" style="margin-left:auto" onclick="closeModal('task-modal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const PRIORITY_ORDER = { haute: 0, moyenne: 1, basse: 2 };
const PRIORITY_LABELS = { haute: 'Haute', moyenne: 'Moyenne', basse: 'Basse' };
const STATUS_LABELS = { todo: 'À faire', inprogress: 'En cours', done: 'Terminé' };
const MONTHS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

let currentFilter = 'all';
let currentSort = 'created';
let currentView = 'list';
let selectedSubject = null;

function getTasks() { return JSON.parse(localStorage.getItem('sh_tasks') || '[]'); }
function saveTasks(t) { localStorage.setItem('sh_tasks', JSON.stringify(t)); }

function getSubjects() {
  const tasks = getTasks();
  return [...new Set(tasks.map(t => t.subject).filter(Boolean))];
}

function setFilter(f, btn) {
  currentFilter = f;
  selectedSubject = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

function setSort(s, btn) {
  currentSort = s;
  document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

function setView(v) {
  currentView = v;
  document.getElementById('list-view-btn').classList.toggle('active', v === 'list');
  document.getElementById('kanban-view-btn').classList.toggle('active', v === 'kanban');
  renderTasks();
}

function filterTasks(tasks) {
  const now = new Date();
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() + 7);
  const search = document.getElementById('search-input').value.toLowerCase();

  let filtered = tasks;
  if (search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search) || (t.subject||'').toLowerCase().includes(search));
  if (selectedSubject) filtered = filtered.filter(t => t.subject === selectedSubject);

  switch(currentFilter) {
    case 'today': filtered = filtered.filter(t => !t.done && t.due && new Date(t.due) <= todayEnd); break;
    case 'week': filtered = filtered.filter(t => !t.done && t.due && new Date(t.due) <= weekEnd); break;
    case 'overdue': filtered = filtered.filter(t => !t.done && t.due && new Date(t.due) < now); break;
    case 'done': filtered = filtered.filter(t => t.done); break;
    case 'p-haute': filtered = filtered.filter(t => t.priority === 'haute' && !t.done); break;
    case 'p-moyenne': filtered = filtered.filter(t => t.priority === 'moyenne' && !t.done); break;
    case 'p-basse': filtered = filtered.filter(t => t.priority === 'basse' && !t.done); break;
  }
  return filtered;
}

function sortTasks(tasks) {
  return [...tasks].sort((a, b) => {
    if (currentSort === 'priority') return (PRIORITY_ORDER[a.priority]||1) - (PRIORITY_ORDER[b.priority]||1);
    if (currentSort === 'due') {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return new Date(a.due) - new Date(b.due);
    }
    return (b.id||'0').localeCompare(a.id||'0');
  });
}

function formatDue(due) {
  if (!due) return null;
  const d = new Date(due);
  const now = new Date();
  const diff = d - now;
  const days = Math.floor(diff / (1000*60*60*24));
  if (diff < 0) return { text: `En retard de ${Math.abs(days)}j`, cls: 'overdue' };
  if (days === 0) return { text: 'Aujourd\'hui', cls: 'soon' };
  if (days === 1) return { text: 'Demain', cls: 'soon' };
  if (days <= 3) return { text: `Dans ${days} jours`, cls: 'soon' };
  return { text: `${d.getDate()} ${MONTHS[d.getMonth()]}`, cls: '' };
}

function getSubjectColor(subject) {
  const subjects = getSubjects();
  const idx = subjects.indexOf(subject);
  const colors = ['cyan','pink','yellow','green','violet','orange'];
  return colors[idx % colors.length];
}

function renderTasks() {
  const allTasks = getTasks();
  const now = new Date();
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);

  // Update counts
  const active = allTasks.filter(t => !t.done);
  const done = allTasks.filter(t => t.done);
  const overdue = allTasks.filter(t => !t.done && t.due && new Date(t.due) < now);
  document.getElementById('count-total').textContent = active.length;
  document.getElementById('count-done').textContent = done.length;
  document.getElementById('count-overdue').textContent = overdue.length;
  const pct = allTasks.length ? Math.round(done.length / allTasks.length * 100) : 0;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('tasks-subtitle').textContent = `${active.length} tâche${active.length!==1?'s':''} en cours · ${done.length} terminée${done.length!==1?'s':''}`;

  document.getElementById('fc-all').textContent = active.length;
  document.getElementById('fc-today').textContent = active.filter(t => t.due && new Date(t.due) <= todayEnd).length;
  document.getElementById('fc-week').textContent = active.filter(t => t.due && new Date(t.due) <= weekEnd).length;
  document.getElementById('fc-overdue').textContent = overdue.length;
  document.getElementById('fc-done').textContent = done.length;
  document.getElementById('fc-haute').textContent = active.filter(t => t.priority==='haute').length;
  document.getElementById('fc-moyenne').textContent = active.filter(t => t.priority==='moyenne').length;
  document.getElementById('fc-basse').textContent = active.filter(t => t.priority==='basse').length;

  // Subject filters
  const subjects = getSubjects();
  const sfEl = document.getElementById('subject-filters');
  sfEl.innerHTML = subjects.map(s => {
    const col = getSubjectColor(s);
    const isActive = selectedSubject === s;
    return `<button class="filter-btn ${isActive?'active':''}" onclick="filterBySubject('${s}',this)" style="${isActive?`color:var(--${col})`:``}">
      <span><span class="subject-dot" style="background:var(--${col})"></span>${s}</span>
      <span class="filter-count">${allTasks.filter(t=>t.subject===s&&!t.done).length}</span>
    </button>`;
  }).join('') || '<p style="font-size:12px;color:var(--text-dim);padding:4px 12px">Aucune matière</p>';

  // Update datalist
  document.getElementById('subjects-datalist').innerHTML = subjects.map(s => `<option value="${s}">`).join('');

  const filtered = sortTasks(filterTasks(allTasks));
  const container = document.getElementById('tasks-container');

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">✅</div>
      <div class="empty-state-text">Aucune tâche ici</div>
      <div class="empty-state-sub">Clique sur "Nouvelle tâche" pour commencer</div>
    </div>`;
    return;
  }

  if (currentView === 'kanban') {
    renderKanban(filtered, container);
  } else {
    renderList(filtered, container);
  }
}

function renderList(tasks, container) {
  const todo = tasks.filter(t => !t.done && t.status !== 'inprogress');
  const inProgress = tasks.filter(t => !t.done && t.status === 'inprogress');
  const done = tasks.filter(t => t.done);

  let html = '';
  if (inProgress.length) html += renderGroup('⚙️ En cours', inProgress, 'var(--cyan)');
  if (todo.length) html += renderGroup('📌 À faire', todo, 'var(--text-muted)');
  if (done.length) html += renderGroup('✅ Terminées', done, 'var(--green)');
  container.innerHTML = html;
}

function renderGroup(title, tasks, color) {
  return `<div class="task-group">
    <div class="task-group-header">
      <div class="task-group-title" style="color:${color}">${title}</div>
      <span class="task-group-count">${tasks.length}</span>
    </div>
    ${tasks.map(t => renderTaskCard(t)).join('')}
  </div>`;
}

function renderTaskCard(t) {
  const due = formatDue(t.due);
  const col = getSubjectColor(t.subject);
  return `<div class="task-card priority-${t.priority||'moyenne'} ${t.done?'done-card':''} fade-in" onclick="openEditTask('${t.id}')">
    <div class="task-check" onclick="event.stopPropagation();toggleTask('${t.id}')"></div>
    <div class="task-body">
      <div class="task-title">${escHtml(t.title)}</div>
      ${t.desc ? `<div class="task-desc">${escHtml(t.desc)}</div>` : ''}
      <div class="task-meta">
        ${t.subject ? `<span class="task-tag" style="background:rgba(var(--rgb-${col},0,229,255),0.1);color:var(--${col});background:color-mix(in srgb,var(--${col}) 12%,transparent)">${escHtml(t.subject)}</span>` : ''}
        <span class="priority-badge p-${t.priority||'moyenne'}">${PRIORITY_LABELS[t.priority]||'Moyenne'}</span>
        ${due ? `<span class="task-due ${due.cls}">🕐 ${due.text}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-action-btn del" title="Supprimer" onclick="event.stopPropagation();deleteTaskById('${t.id}')">🗑</button>
    </div>
  </div>`;
}

function renderKanban(tasks, container) {
  const cols = [
    { key: 'todo',       label: '📌 À faire',  tasks: tasks.filter(t => !t.done && t.status !== 'inprogress') },
    { key: 'inprogress', label: '⚙️ En cours',  tasks: tasks.filter(t => !t.done && t.status === 'inprogress') },
    { key: 'done',       label: '✅ Terminées', tasks: tasks.filter(t => t.done) },
  ];
  container.innerHTML = `<div class="kanban-board">${cols.map(col => `
    <div class="kanban-col">
      <div class="kanban-col-header">
        <span class="kanban-col-title">${col.label}</span>
        <span class="kanban-col-count">${col.tasks.length}</span>
      </div>
      ${col.tasks.map(t => {
        const due = formatDue(t.due);
        const scol = getSubjectColor(t.subject);
        return `<div class="kanban-task priority-${t.priority||'moyenne'}" onclick="openEditTask('${t.id}')">
          <div class="kanban-task-title">${escHtml(t.title)}</div>
          <div class="kanban-task-meta">
            ${t.subject ? `<span class="task-tag" style="font-size:10px;color:var(--${scol});background:color-mix(in srgb,var(--${scol}) 12%,transparent);padding:2px 7px;border-radius:20px;font-weight:700">${escHtml(t.subject)}</span>` : ''}
            ${due ? `<span style="font-size:10px;color:${due.cls==='overdue'?'var(--pink)':due.cls==='soon'?'var(--yellow)':'var(--text-dim)'}">${due.text}</span>` : ''}
          </div>
        </div>`;
      }).join('')}
      <button class="btn btn-ghost" style="width:100%;justify-content:center;font-size:12px;margin-top:8px" onclick="openAddTask('${col.key}')">+ Ajouter</button>
    </div>`).join('')}
  </div>`;
}

function toggleTask(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; if (t.done) t.status = 'done'; else t.status = 'todo'; saveTasks(tasks); renderTasks(); }
}

function deleteTaskById(id) {
  if (!confirm('Supprimer cette tâche ?')) return;
  saveTasks(getTasks().filter(t => t.id !== id));
  renderTasks();
}

function filterBySubject(s, btn) {
  selectedSubject = selectedSubject === s ? null : s;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (selectedSubject) btn.classList.add('active');
  else document.querySelector('[data-filter="all"]').classList.add('active');
  renderTasks();
}

function openAddTask(status = 'todo') {
  document.getElementById('task-id').value = '';
  document.getElementById('task-title').value = '';
  document.getElementById('task-desc').value = '';
  document.getElementById('task-priority').value = 'moyenne';
  document.getElementById('task-subject').value = '';
  document.getElementById('task-due').value = '';
  document.getElementById('task-status').value = status;
  document.getElementById('task-delete-btn').style.display = 'none';
  document.getElementById('modal-task-title').textContent = 'Nouvelle tâche';
  document.getElementById('task-modal').classList.add('open');
}

function openEditTask(id) {
  const t = getTasks().find(t => t.id === id);
  if (!t) return;
  document.getElementById('task-id').value = t.id;
  document.getElementById('task-title').value = t.title;
  document.getElementById('task-desc').value = t.desc || '';
  document.getElementById('task-priority').value = t.priority || 'moyenne';
  document.getElementById('task-subject').value = t.subject || '';
  document.getElementById('task-due').value = t.due ? t.due.slice(0,16) : '';
  document.getElementById('task-status').value = t.done ? 'done' : (t.status || 'todo');
  document.getElementById('task-delete-btn').style.display = '';
  document.getElementById('modal-task-title').textContent = 'Modifier la tâche';
  document.getElementById('task-modal').classList.add('open');
}

function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { alert('Titre requis'); return; }
  const tasks = getTasks();
  const id = document.getElementById('task-id').value;
  const status = document.getElementById('task-status').value;
  const task = {
    id: id || Date.now().toString(),
    title,
    desc: document.getElementById('task-desc').value.trim(),
    priority: document.getElementById('task-priority').value,
    subject: document.getElementById('task-subject').value.trim(),
    due: document.getElementById('task-due').value || null,
    status,
    done: status === 'done',
    created: id ? (tasks.find(t=>t.id===id)||{}).created || Date.now() : Date.now(),
  };
  if (id) { const idx = tasks.findIndex(t => t.id === id); tasks[idx] = task; }
  else tasks.push(task);
  saveTasks(tasks);
  closeModal('task-modal');
  renderTasks();
}

function deleteTask() {
  const id = document.getElementById('task-id').value;
  if (!confirm('Supprimer cette tâche ?')) return;
  saveTasks(getTasks().filter(t => t.id !== id));
  closeModal('task-modal');
  renderTasks();
}

function clearDone() {
  if (!confirm('Supprimer toutes les tâches terminées ?')) return;
  saveTasks(getTasks().filter(t => !t.done));
  renderTasks();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.getElementById('task-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal('task-modal'); });

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderTasks();
</script>
</body>
</html>
